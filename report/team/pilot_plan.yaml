# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels cho 1.250)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; cần 1.251 × 2,48 = 3.103 yc/nhóm (42 NV/nhóm, tổng 84 > 40 NV hiện có -> không đủ người)
#   c) 20 nhân viên mỗi nhóm: trần hiệu dụng = c / ICC = 20 / 0,02 = 1.000 < 1.251 -> không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: trần hiệu dụng = 6 / 0,02 = 300 < 1.251 (và < 20 cụm/nhóm) -> loại
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) × 0,02) >= 859 -> m >= 299 yc/nhân viên (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng chạy song song cùng thời gian tại cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên 50/50 bằng code có seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền tài khoản riêng và log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, tất cả chốt trước khi chạy trong pilot_plan.yaml.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên (20 cụm/nhóm), không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm (trần 1.000 < 1.251). Nhóm chọn chia theo nhân viên (20+20) để tách tác động và chấp nhận MDE = 6 điểm (859/nhóm, m >= 299, DE = 6,96); nếu tác động thật chỉ 5 điểm thì power còn ~0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại là 51/1.200 = 4,25% toàn mẫu (và 39/982 = 3,97% trong phạm vi noi_dia + hang_nang). Nếu đặt ngưỡng tuyệt đối 1–2% sẽ dừng ngay tuần đầu; nên dùng ngưỡng chênh +2 điểm so với đối chứng kèm trần tuyệt đối 6% và xem lại 100% ở bước 10%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (0,22x, simulated) và hang_nang (0,69x, simulated) tại 12 depot; loại quoc_te (1,88x) và doi_tac (0,85x)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 10% (4 NV) -> 25% (10 NV) mỗi bước 1 tuần; chỉ đo chỉ số chính từ bước 50% (20 NV/nhóm, đủ >= 299 yc/NV)
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi từ 0.05 lên 0.06 do giới hạn 40 nhân viên (power ~0,64 nếu tác động thật 0.05)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy cùng tuần, cùng 12 depot"
    spillover_risk: "Trung bình (cùng depot); giảm bằng phân quyền tài khoản riêng và log mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, MDE 0.06, ngưỡng dừng và ngày quyết định chốt trước ngày chạy"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng >= 2 điểm phần trăm hoặc vượt trần 6%, hoặc phát sinh >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng thêm hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn tối thiểu 5 nhân viên và rà 20 trace trong 3 ngày làm việc KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn hằng ngày/tuần, không kết luận hiệu quả sớm trước decision_date"
  rollback: "Giám đốc vận hành LogiX-VN bật cờ tắt trợ lý, hiệu lực trong 30 phút; toàn bộ yêu cầu chuyển tự động về luồng nhân viên CSKH tự xử lý (không gián đoạn khách hàng)"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "CPS toàn mẫu A2: 4.472 đ (simulated; xem lại 1.780.000 đ, làm lại 2.264.000 đ)"
    - "Chi phí cả hệ thống/yc A2: 5.865 đ = 0,49x (simulated)"
    - "CPS theo loại A3: noi_dia 2.696 đ (0,22x), hang_nang 8.221 đ (0,69x), quoc_te 22.515 đ (1,88x), doi_tac 10.215 đ (0,85x) (simulated)"
    - "CPS phạm vi pilot + cố định 40 tr/tháng A4: 4.599 đ (0,38x) ở 45.000 yc/tháng và 5.784 đ (0,48x) ở 22.500 yc/tháng (simulated)"
    - "CPS xem lại 100% B4 (noi_dia + hang_nang): 11.743 đ = 0,98x (9p làm lại) và 12.415 đ = 1,03x (15,3p thực tế) (simulated)"
